<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pbrain review</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9; --panel: #fff; --text: #1d2125; --muted: #6b7480; --line: #dde1e6;
  --accent: #2563eb; --accent-text: #fff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  --code: #eef0f3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --panel: #1c2024; --text: #e6e8eb; --muted: #98a1ac; --line: #2e343a;
    --accent: #5b8cff; --accent-text: #0b1020; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --code: #262b30;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
header {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.tabs, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tab, .chip { border-radius: 999px; padding: 3px 11px; background: transparent; }
.tab.on, .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.spacer { flex: 1; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 380px) 1fr; }
#list { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
#detail { overflow: auto; padding: 16px 20px; }
.item {
  display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
  border-radius: 0; padding: 9px 12px; background: transparent;
}
.item.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .d { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
  padding: 1px 7px; border-radius: 4px; margin-right: 6px; background: var(--code); color: var(--muted);
}
.badge.error { color: var(--bad); } .badge.warning, .badge.drift { color: var(--warn); }
.badge.new { color: var(--ok); }
.badge.inbox { color: var(--accent); } .badge.trust { color: var(--ok); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
.form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; padding: 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.msg { margin: 8px 0; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
.msg.bad { border-color: var(--bad); color: var(--bad); }
h2 { margin: 0 0 4px; font-size: 18px; }
.sub { color: var(--muted); margin-bottom: 8px; word-break: break-word; }
table.fm { border-collapse: collapse; margin: 8px 0 14px; font-size: 13px; }
table.fm td { padding: 2px 12px 2px 0; vertical-align: top; }
table.fm td:first-child { color: var(--muted); }
.md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; font-size: 16px; }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.md pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; }
.md pre code { padding: 0; background: none; }
.md a { color: var(--accent); }
pre.diff { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 60vh; }
textarea.edit { width: 100%; min-height: 55vh; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
#empty { text-align: center; color: var(--muted); padding: 60px 20px; }
#empty b { display: block; font-size: 20px; color: var(--ok); margin-bottom: 6px; }
#toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text);
  color: var(--bg); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: .95; }
#commitbox {
  position: absolute; right: 14px; top: 48px; width: min(460px, 94vw); z-index: 5;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
#commitbox textarea { width: 100%; }
#commitbox pre { max-height: 160px; overflow: auto; font-size: 12px; background: var(--code); padding: 6px; border-radius: 6px; margin: 6px 0; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; }
dialog td { padding: 3px 12px 3px 0; } kbd { background: var(--code); border-radius: 4px; padding: 0 5px; }
.hidden { display: none !important; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(120px, 38vh) 1fr; }
  #list { border-right: 0; border-bottom: 1px solid var(--line); }
}
#body table { border-collapse: collapse; margin: 8px 0; }
#body th, #body td { border: 1px solid color-mix(in srgb, currentColor 22%, transparent); padding: 4px 8px; text-align: left; vertical-align: top; }
#src { width: min(920px, 94vw); max-height: 88vh; padding: 0; }
#src[open] { display: flex; flex-direction: column; }
#srcHead { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
#srcHead b { flex: 1; overflow-wrap: anywhere; }
#srcBody { min-height: 0; overflow: auto; padding: 4px 18px 16px; }
#srcBody .hit { background: color-mix(in srgb, #f5c400 30%, transparent); scroll-margin-top: 8px; }
.chip[data-kind="read"] { margin-right: 10px; }
a.ref { text-decoration: underline dotted; }
.anchor { text-decoration: none; opacity: .45; font-weight: 400; }
.anchor:hover { opacity: 1; }
.hint { margin: 6px 0 10px; opacity: .8; }
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="chips"></div>
  <span class="spacer"></span>
  <span id="scanInfo" class="sub"></span>
  <button id="commitBtn"></button>
  <button id="langBtn" title="Language"></button>
  <button id="helpBtn">?</button>
</header>
<div id="commitbox" class="hidden">
  <div class="sub" id="commitFiles"></div>
  <textarea id="commitMsg" rows="2"></textarea>
  <div class="actions"><button class="primary" id="commitGo"></button><button id="commitClose"></button></div>
  <pre id="commitOut" class="hidden"></pre>
</div>
<main>
  <div id="list"></div>
  <div id="detail"></div>
</main>
<dialog id="src"><div id="srcHead"></div><div id="srcBody" class="md"></div></dialog>
<dialog id="help"><table id="helpRows"></table><form method="dialog"><button></button></form></dialog>
<div id="toast"></div>
<script>
"use strict";
const TOKEN = "__PBRAIN_TOKEN__";
const I18N = {
  en: {
    read: "Read", indexTitle: "Index",
    all: "All", lint: "Lint", drift: "Drift", inbox: "Inbox", trust: "Trust",
    changed: "Changed files", commit: "Commit", commitMsg: "docs(wiki): review decisions",
    commitHint: "Only files under the wiki directory are committed. Nothing is pushed.",
    hint_trust: "You asked for this page but never confirmed its content. Approve if it says what you want, edit it, or deprecate it.",
    hint_inbox: "A note waiting to be filed. Keep it as a new page, merge it into an existing page, or discard it.",
    hint_drift: "The code this page describes changed after the page was last checked. Confirm if the page is still right, or edit it.",

    newPage: "New page", append: "Append to...", discard: "Discard", showDiff: "Show diff",
    name: "Name", title: "Title", type: "Type", trustL: "Trust", page: "Page", section: "Section",
    create: "Create", add: "Append", save: "Save", cancel: "Cancel", close: "Close",
    saved: "Saved", conflict: "The file changed on disk since you opened it. Cancel and reopen.",
    sure: "Are you sure?", loading: "Loading...", error: "Error", noFiles: "No changed files.",
    sKeys: "Keyboard shortcuts", kMove: "Next / previous item", kApprove: "Approve / confirm",
    kEdit: "Edit", kDel: "Discard / deprecate", kHelp: "This help", lang: "VI",
    covers: "Covers", inboxFrom: "Inbox file", pending: "pending", fail: "Request failed",
    isNew: "new", lastScan: "Last scan"
  },
  vi: {
    read: "Đọc", indexTitle: "Mục lục",
    all: "Tất cả", lint: "Lint", drift: "Lệch code", inbox: "Hộp thư", trust: "Độ tin cậy",
    changed: "File thay đổi", commit: "Commit", commitMsg: "docs(wiki): duyệt quyết định",
    commitHint: "Chỉ commit các file trong thư mục wiki. Không push.",
    hint_trust: "Trang này viết theo yêu cầu của bạn nhưng bạn chưa xác nhận nội dung. Đúng ý thì Duyệt, chưa đúng thì Sửa, không cần nữa thì Ngừng dùng.",
    hint_inbox: "Ghi chú đang chờ xếp chỗ. Giữ thành trang mới, gộp vào trang có sẵn, hoặc bỏ.",
    hint_drift: "Code mà trang này mô tả đã đổi sau lần kiểm gần nhất. Trang còn đúng thì Xác nhận, hết đúng thì Sửa.",
    hint_lint: "Trang vi phạm quy ước wiki. Bấm Sửa để chỉnh theo thông báo.",
    offline: "Không kết nối được máy chủ trang duyệt. Kiểm tra nó còn chạy không, rồi tải lại trang.",
    srcJump: "Tới mục số", srcOpen: "Mở đường dẫn", srcNone: "Nguồn này không phải file của dự án đang mở.",
    gone: "Mục trong đường dẫn không còn chờ nữa (đã xử lý).",
    nothing: "Không còn gì chờ duyệt", nothingSub: "Dự án này không có quyết định nào đang chờ.",
    approve: "Duyệt", confirm: "Xác nhận (vẫn đúng)", edit: "Sửa", deprecate: "Ngừng dùng",
    newPage: "Trang mới", append: "Gộp vào...", discard: "Bỏ", showDiff: "Xem diff",
    name: "Tên", title: "Tiêu đề", type: "Loại", trustL: "Độ tin cậy", page: "Trang", section: "Mục",
    create: "Tạo", add: "Gộp", save: "Lưu", cancel: "Hủy", close: "Đóng",
    saved: "Đã lưu", conflict: "File đã đổi trên đĩa kể từ khi bạn mở. Hãy hủy và mở lại.",
    sure: "Bạn chắc chắn chứ?", loading: "Đang tải...", error: "Lỗi", noFiles: "Không có file thay đổi.",
    sKeys: "Phím tắt", kMove: "Mục kế / mục trước", kApprove: "Duyệt / xác nhận",
    kEdit: "Sửa", kDel: "Bỏ / ngừng dùng", kHelp: "Trợ giúp này", lang: "EN",
    covers: "Bao phủ", inboxFrom: "File hộp thư", pending: "đang chờ", fail: "Yêu cầu thất bại",
    isNew: "mới", lastScan: "Quét lần cuối"
  }
};
const TYPES = ["concept", "feature", "rule", "decision", "contract", "gotcha"];
const TRUSTS = ["agreed", "requested", "inferred"];
const KINDS = ["lint", "drift", "inbox", "trust"];
let lang = localStorage.getItem("pbrain.lang") || (/^vi/i.test(navigator.language) ? "vi" : "en");
const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const S = { scannedAt: "", projects: [], cur: 0, data: {}, kind: null, sel: null, editing: null, panel: null, diff: null, note: null };

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Pbrain-Token": TOKEN },
    body: JSON.stringify(body)
  };
  let res, data;
  try { res = await fetch(path, opt); data = await res.json(); }
  catch (e) { return { ok: false, message: t("fail") + ": " + e }; }
  data.status = res.status;
  return data;
}

function toast(text) {
  const el = $("toast"); el.textContent = text; el.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------- markdown (escape first, then a small subset) ---------- */
function inline(raw) {
  const codes = [];
  let s = esc(raw).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
    const safe = /^(https?:\/\/|[\w./#-][^:]*$)/i.test(url) && !/^\s*javascript/i.test(url);
    return safe ? '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + text + "</a>" : m;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^\w*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
       .replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, "$1<i>$2</i>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, n) => "<code>" + codes[+n] + "</code>");
}
function markdown(text) {
  const out = []; let list = null, para = [], fence = null, item = null, table = [];
  const cells = (l) => { let s = l.trim().slice(1); if (s.endsWith("|")) s = s.slice(0, -1); return s.split("|").map((c) => c.trim()); };
  const isSep = (l) => cells(l).every((c) => c && [...c].every((ch) => ch === "-" || ch === ":"));
  const flushTable = () => {
    if (!table.length) return;
    const head = table.length > 1 && isSep(table[1]);
    const row = (l, tag) => "<tr>" + cells(l).map((c) => "<" + tag + ">" + inline(c) + "</" + tag + ">").join("") + "</tr>";
    out.push("<table>" + table.filter((l, i) => !(head && i === 1)).map((l, i) => row(l, head && i === 0 ? "th" : "td")).join("") + "</table>");
    table = [];
  };
  const flushPara = () => { if (para.length) out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; };
  const flushItem = () => { if (item !== null) out.push("<li>" + inline(item.join(" ")) + "</li>"); item = null; };
  const flushList = () => { flushItem(); if (list) { out.push("</" + list + ">"); list = null; } };
  for (const line of text.replace(/\r\n?/g, "\n").split("\n")) {
    if (fence !== null) {
      if (/^\s*(```|~~~)/.test(line)) { out.push("<pre><code>" + esc(fence.join("\n")) + "</code></pre>"); fence = null; }
      else fence.push(line);
      continue;
    }
    if (/^\s*(```|~~~)/.test(line)) { flushPara(); flushList(); fence = []; continue; }
    if (line.trim().startsWith("|")) { flushPara(); flushList(); table.push(line); continue; }
    flushTable();
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    const li = /^\s*([-*+]|\d+\.)\s+(.*)$/.exec(line);
    if (h) { flushPara(); flushList(); const n = Math.min(h[1].length + 1, 4); out.push("<h" + n + ">" + inline(h[2]) + "</h" + n + ">"); }
    else if (li) {
      flushPara(); const kind = /\d/.test(li[1]) ? "ol" : "ul";
      if (list !== kind) { flushList(); out.push("<" + kind + (kind === "ol" ? ' start="' + parseInt(li[1], 10) + '"' : "") + ">"); list = kind; }
      flushItem(); item = [li[2]];
    } else if (!line.trim()) { flushPara(); flushList(); }
    else if (item !== null) item.push(line.trim());
    else { flushList(); para.push(line.trim()); }
  }
  if (fence !== null) out.push("<pre><code>" + esc(fence.join("\n")) + "</code></pre>");
  flushTable(); flushPara(); flushList();
  return out.join("\n");
}
function renderPage(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(text);
  if (!m) return '<div class="md">' + markdown(text) + "</div>";
  const rows = []; let key = null;
  for (const line of m[1].split(/\r?\n/)) {
    const kv = /^([A-Za-z_]+):\s*(.*)$/.exec(line), it = /^\s*-\s+(.*)$/.exec(line);
    if (kv) { key = kv[1]; rows.push([key, kv[2]]); }
    else if (it && rows.length) rows[rows.length - 1][1] += (rows[rows.length - 1][1] ? "\n" : "") + it[1];
  }
  const refs = (k, v) => k === "sources" || k === "covers"
    ? v.split("\n").filter(Boolean).map((r) => '<a href="#" data-src="' + esc(r) + '">' + esc(r) + "</a>").join("<br>")
    : esc(v).replace(/\n/g, "<br>");
  const table = rows.map(([k, v]) => "<tr><td>" + esc(k) + "</td><td>" + refs(k, v) + "</td></tr>").join("");
  return '<table class="fm">' + table + '</table><div class="md">' + markdown(m[2]) + "</div>";
}

/* ---------- source viewer ---------- */
async function openSource(ref) {
  const res = await api("/api/source?project=" + S.cur + "&ref=" + encodeURIComponent(ref));
  const close = '<form method="dialog"><button>' + esc(t("close")) + "</button></form>";
  if (!res.ok) {
    $("srcHead").innerHTML = "<b>" + esc(ref) + "</b>" + close;
    $("srcBody").innerHTML = "<p>" + esc(res.status === 404 ? t("srcNone") : res.status ? res.message : t("offline")) + "</p>" +
      (res.url ? '<p><a href="' + esc(res.url) + '" target="_blank" rel="noopener noreferrer">' + esc(t("srcOpen")) + "</a></p>" : "");
  } else {
    $("srcHead").innerHTML = "<b>" + esc(res.project + " / " + res.path + (res.symbol ? " :: " + res.symbol : "")) + "</b>" +
      (res.markdown ? "<label>" + esc(t("srcJump")) + ' <input id="srcJump" inputmode="numeric" size="4"></label>' : "") + close;
    $("srcBody").innerHTML = res.markdown ? markdown(res.text) : "<pre><code>" + esc(res.text) + "</code></pre>";
  }
  if (!$("src").open) $("src").showModal();
  $("srcBody").scrollTop = 0;
}
function jumpSource(label) {
  const body = $("srcBody"), key = String(label).trim().replace(/\.$/, "");
  if (!key) return;
  const heads = [...body.querySelectorAll("h1,h2,h3,h4")];
  let hit = heads.find((h) => { const s = h.textContent.trim(); return s.startsWith(key + ".") || s.startsWith(key + " "); });
  if (!hit && /^\d+$/.test(key)) {
    const n = +key;
    for (const ol of body.querySelectorAll("ol")) {
      const at = n - (ol.start || 1);
      if (at >= 0 && at < ol.children.length) { hit = ol.children[at]; break; }
    }
  }
  body.querySelectorAll(".hit").forEach((x) => x.classList.remove("hit"));
  if (!hit) return;
  hit.classList.add("hit");
  body.scrollTop += hit.getBoundingClientRect().top - body.getBoundingClientRect().top - 8;
}
document.addEventListener("input", (e) => { if (e.target.id === "srcJump") jumpSource(e.target.value); });
document.addEventListener("click", async (e) => {
  const a = e.target.closest("[data-src]"); if (!a) return;
  e.preventDefault();
  await openSource(a.dataset.src);
  if (a.dataset.jump) { const box = $("srcJump"); if (box) box.value = a.dataset.jump; jumpSource(a.dataset.jump); }
});

/* "mục 12, 13" / "item 4" in a page body become links into the page's sources. The file is
   the nearest source named earlier in the same paragraph or list item, else the first source. */
const REF_WORD = /\b(mục|muc|item|section|§)\s+(\d+(?:\.\d+)*(?:\s*(?:,|và|and|-)\s*\d+(?:\.\d+)*)*)/giu;
function linkRefs(root, sources) {
  if (!sources.length) return;
  const base = (s) => s.split(/[\\/]/).pop().split("::")[0].toLowerCase();
  const byName = new Map(sources.map((s) => [base(s), s]));
  for (const block of root.querySelectorAll(".md li, .md p")) {
    let current = sources[0];
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      if (node.parentElement.closest("li, p") !== block) continue;
      const named = byName.get(node.textContent.trim().toLowerCase());
      if (node.parentElement.tagName === "CODE") { if (named) current = named; continue; }
      const text = node.textContent; REF_WORD.lastIndex = 0;
      if (!REF_WORD.test(text)) continue;
      const frag = document.createDocumentFragment(); let last = 0; REF_WORD.lastIndex = 0;
      for (const m of text.matchAll(REF_WORD)) {
        frag.append(text.slice(last, m.index) + m[1] + " ");
        const numbers = m[2]; let pos = 0;
        for (const n of numbers.matchAll(/\d+(?:\.\d+)*/g)) {
          frag.append(numbers.slice(pos, n.index));
          const a = document.createElement("a");
          a.href = "#"; a.textContent = n[0]; a.className = "ref";
          a.dataset.src = current; a.dataset.jump = n[0];
          a.title = base(current) + " · " + n[0];
          frag.append(a); pos = n.index + n[0].length;
        }
        frag.append(numbers.slice(pos)); last = m.index + m[0].length;
      }
      frag.append(text.slice(last));
      node.replaceWith(frag);
    }
  }
}
function pageSources(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---/.exec(text || ""); if (!m) return [];
  const out = []; let inSources = false;
  for (const line of m[1].split(/\r?\n/)) {
    if (/^[A-Za-z_]+:/.test(line)) { inSources = line.startsWith("sources:"); continue; }
    const it = /^\s*-\s+(.*)$/.exec(line);
    if (inSources && it) out.push(it[1].trim());
  }
  return out;
}

/* ---------- read mode: every page, links between pages ---------- */
function libraryItems() {
  const d = proj(); if (!d || !d.library) return [];
  return d.library.map((p) => ({
    id: "page:" + p.page, kind: "page", page: p.page,
    title: p.page === "index.md" ? t("indexTitle") : p.title,
    detail: [p.type, p.trust, p.status !== "active" ? p.status : ""].filter(Boolean).join(" · ") || p.page,
  }));
}
function openPage(name) {
  S.kind = "read"; S.sel = "page:" + name; S.editing = S.panel = S.diff = S.note = null;
  history.pushState(null, "", hashFor(S.sel));  // so the browser's Back returns to the previous page
  render();
  $("detail").scrollTop = 0;
}
/* Relative links inside a page: another wiki page opens in read mode, any other tracked file
   opens in the source viewer, external links open in a new tab as before. */
document.addEventListener("click", (e) => {
  const a = e.target.closest("#body a[href]"); if (!a || a.dataset.src) return;
  const href = a.getAttribute("href");
  if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("#")) return;
  e.preventDefault();
  const clean = href.split("#")[0];
  const d = proj();
  if (d && d.library && d.library.some((p) => p.page === clean)) return openPage(clean);
  const wikiDir = (S.projects[S.cur] || {}).wiki || "";
  openSource((wikiDir ? wikiDir.replace(/\/$/, "") + "/" : "") + clean);
});

/* ---------- data ---------- */
const proj = () => S.data[S.cur];
function visible() {
  const d = proj(); if (!d || !d.items) return [];
  if (S.kind === "read") return libraryItems();
  return d.items.filter((i) => !S.kind || i.kind === S.kind);
}
function current() { return visible().find((i) => i.id === S.sel) || null; }

/* The address bar names the open item as #<project>/<item id>, so a link can be shared. */
function hashFor(id) {
  const p = S.projects[S.cur];
  return p && id ? "#" + encodeURIComponent(p.name) + "/" + encodeURIComponent(id) : "";
}
function readHash() {
  const raw = location.hash.slice(1), cut = raw.indexOf("/");
  if (cut < 1) return null;
  try { return { name: decodeURIComponent(raw.slice(0, cut)), id: decodeURIComponent(raw.slice(cut + 1)) }; }
  catch (e) { return null; }
}
function applyHash(final) {
  if (!S.want) return;
  const idx = S.projects.findIndex((p) => p.name === S.want.name);
  const d = S.data[idx];
  const isPage = S.want.id.startsWith("page:");
  const pool = d ? (isPage ? (S.cur = idx, libraryItems()) : d.items || []) : [];
  if (d && pool.find((x) => x.id === S.want.id)) {
    S.cur = idx; S.kind = isPage ? "read" : null; S.sel = S.want.id; S.want = null;
    S.editing = S.panel = S.diff = S.note = null;
  } else if (final || idx < 0 || d) { S.want = null; toast(t("gone")); }
}
function syncHash() {
  if (S.want) return;
  const h = hashFor(S.sel);
  if (h !== location.hash) history.replaceState(null, "", h || location.pathname + location.search);
}
async function loadProject(i, keepSel) {
  const res = await api("/api/queue?project=" + i);
  if (!res.ok) { toast(t("error") + ": " + res.message); return; }
  S.data[i] = res;
  applyHash(false);
  if (i === S.cur && !keepSel) selectFirstIfNone();
  render();
}
function selectFirstIfNone() {
  const list = visible();
  if (!list.find((x) => x.id === S.sel)) S.sel = list.length ? list[0].id : null;
  S.editing = S.panel = S.diff = S.note = null;
}
async function init() {
  const res = await api("/api/projects");
  S.projects = res.projects || [];
  S.scannedAt = res.scanned_at || "";
  S.want = readHash();
  await loadProject(0);
  for (let i = 1; i < S.projects.length; i++) await loadProject(i);
  applyHash(true); render();
}
window.addEventListener("popstate", () => window.dispatchEvent(new HashChangeEvent("hashchange")));
window.addEventListener("hashchange", () => {
  const want = readHash();
  if (!want || location.hash === hashFor(S.sel)) return;
  S.want = want; applyHash(true); selectFirstIfNone(); render();
});

/* ---------- render ---------- */
function render() {
  syncHash();
  document.documentElement.lang = lang;
  $("langBtn").textContent = t("lang");
  const d = proj();
  $("tabs").innerHTML = S.projects.map((p) => {
    const n = S.data[p.index] ? S.data[p.index].total : "…";
    return '<button class="tab' + (p.index === S.cur ? " on" : "") + '" data-tab="' + p.index + '" title="' + esc(p.root) + '">' + esc(p.name) + " " + n + "</button>";
  }).join("");
  const counts = d ? d.counts : {};
  $("chips").innerHTML = ["read", null, ...KINDS].map((k) => {
    const n = k === "read" ? (d && d.library ? d.library.length : 0) : k ? counts[k] || 0 : d ? d.total : 0;
    return '<button class="chip' + (S.kind === k ? " on" : "") + '" data-kind="' + (k || "") + '">' + t(k || "all") + " " + n + "</button>";
  }).join("");
  $("scanInfo").textContent = S.scannedAt ? t("lastScan") + ": " + new Date(S.scannedAt).toLocaleString(lang) : "";
  const changes = d ? d.git_changes : [];
  $("commitBtn").textContent = t("changed") + ": " + changes.length + " — " + t("commit");
  renderList(); renderDetail();
}
function renderList() {
  const list = visible(), el = $("list");
  if (!proj()) { el.innerHTML = '<div id="empty">' + t("loading") + "</div>"; return; }
  el.innerHTML = list.map((i) => {
    const cls = i.kind === "lint" ? i.severity : i.kind;
    const fresh = ((S.projects[S.cur] || {}).new || []).includes(i.id) ? '<span class="badge new">' + t("isNew") + "</span>" : "";
    return '<button class="item' + (i.id === S.sel ? " sel" : "") + '" data-id="' + esc(i.id) + '"><div class="t"><span class="badge ' + cls + '">' +
      esc(i.kind === "lint" ? i.severity : i.kind) + "</span>" + fresh + esc(i.title) + '</div><div class="d">' + esc(i.detail) + "</div></button>";
  }).join("");
  const sel = el.querySelector(".sel"); if (sel) sel.scrollIntoView({ block: "nearest" });
}
async function renderDetail() {
  const el = $("detail"), item = current();
  if (!proj()) { el.innerHTML = ""; return; }
  if (!item) {
    el.innerHTML = '<div id="empty"><b>' + t("nothing") + "</b>" + t("nothingSub") + "</div>"; return;
  }
  const token = (renderDetail.n = (renderDetail.n || 0) + 1);
  let html = "<h2>" + esc(item.title) + ' <a class="anchor" href="' + esc(hashFor(item.id)) + '">#</a></h2><div class="sub"><span class="badge ' + (item.kind === "lint" ? item.severity : item.kind) + '">' +
    esc(item.kind) + "</span>" + esc(item.page || "") + "</div>";
  if (item.kind !== "page") html += '<div class="hint">' + esc(t("hint_" + item.kind)) + "</div>";
  if (item.kind !== "inbox" && item.kind !== "page") html += '<div class="msg">' + esc(item.detail) + "</div>";
  if (S.note) html += '<div class="msg ' + (S.note.bad ? "bad" : "") + '">' + esc(S.note.text) + "</div>";
  html += actionsHtml(item);
  html += '<div id="panel"></div><div id="body">' + t("loading") + "</div>";
  el.innerHTML = html;
  wirePanel(item);
  if (item.kind === "inbox") { $("body").innerHTML = '<div class="md">' + markdown(item.body) + "</div>"; return; }
  if (S.editing) return showEditor(item);
  const res = await api("/api/page?project=" + S.cur + "&page=" + encodeURIComponent(item.page));
  if (token !== renderDetail.n || !$("body")) return;
  let extra = "";
  if (S.diff) extra = '<pre class="diff">' + esc(S.diff) + "</pre>";
  $("body").innerHTML = (res.ok ? extra + renderPage(res.text) : '<div class="msg bad">' + esc(res.message) + "</div>");
  if (res.ok) linkRefs($("body"), pageSources(res.text));
}
function actionsHtml(item) {
  const b = (a, label, cls) => '<button data-act="' + a + '"' + (cls ? ' class="' + cls + '"' : "") + ">" + t(label) + "</button>";
  let h = '<div class="actions">';
  if (item.kind === "trust") h += b("approve", "approve", "primary") + b("edit", "edit") + b("deprecate", "deprecate", "danger");
  else if (item.kind === "inbox") h += b("newpage", "newPage", "primary") + b("append", "append") + b("discard", "discard", "danger");
  else if (item.kind === "drift") h += b("confirm", "confirm", "primary") + b("diff", "showDiff") + b("edit", "edit");
  else h += b("edit", "edit");
  return h + "</div>";
}
const opts = (list, sel) => list.map((v) => '<option' + (v === sel ? " selected" : "") + ">" + esc(v) + "</option>").join("");
function wirePanel(item) {
  const el = $("panel");
  if (S.panel === "newpage") {
    el.innerHTML = '<div class="form"><label>' + t("name") + ' <input id="fName"></label><label>' + t("title") + ' <input id="fTitle"></label>' +
      "<label>" + t("type") + ' <select id="fType">' + opts(TYPES, "concept") + "</select></label><label>" + t("trustL") +
      ' <select id="fTrust">' + opts(TRUSTS, "inferred") + '</select></label><button class="primary" id="fGo">' + t("create") + "</button></div>";
    $("fName").value = item.heading; $("fTitle").value = item.heading; $("fName").focus();
    $("fGo").onclick = () => act("inbox_to_page", { file: item.file, heading: item.heading, name: $("fName").value,
      title: $("fTitle").value, type: $("fType").value, trust: $("fTrust").value });
  } else if (S.panel === "append") {
    const pages = proj().pages;
    el.innerHTML = '<div class="form"><label>' + t("page") + ' <select id="fPage">' + opts(pages) + "</select></label><label>" + t("section") +
      ' <select id="fSec"></select></label><button class="primary" id="fGo">' + t("add") + "</button></div>";
    const fill = async () => {
      const res = await api("/api/page?project=" + S.cur + "&page=" + encodeURIComponent($("fPage").value));
      const heads = res.ok ? res.text.split(/\r?\n/).filter((l) => /^## /.test(l)) : [];
      $("fSec").innerHTML = opts(heads);
    };
    $("fPage").onchange = fill; fill();
    $("fGo").onclick = () => act("inbox_append", { file: item.file, heading: item.heading, page: $("fPage").value, section: $("fSec").value });
  }
}
async function showEditor(item) {
  const res = await api("/api/page?project=" + S.cur + "&page=" + encodeURIComponent(item.page));
  if (!res.ok) { $("body").innerHTML = '<div class="msg bad">' + esc(res.message) + "</div>"; return; }
  $("body").innerHTML = '<textarea class="edit" id="editor" spellcheck="false"></textarea><div class="actions"><button class="primary" id="eSave">' +
    t("save") + '</button><button id="eCancel">' + t("cancel") + "</button></div>";
  $("editor").value = res.text; $("editor").focus();
  $("eCancel").onclick = () => { S.editing = null; renderDetail(); };
  $("eSave").onclick = async () => {
    const r = await api("/api/action", { project: S.cur, action: "save_page", page: item.page, text: $("editor").value, sha: res.sha });
    if (r.ok) { toast(t("saved")); S.editing = null; await reload(); }
    else S.note = { bad: true, text: r.conflict ? t("conflict") : r.message }, renderDetailNote();
  };
}
function renderDetailNote() {
  const old = document.querySelector("#detail .msg.bad"); if (old) old.remove();
  const box = document.createElement("div"); box.className = "msg bad"; box.textContent = S.note.text;
  $("detail").insertBefore(box, $("detail").children[2]);
}

/* ---------- actions ---------- */
async function reload() { await loadProject(S.cur, true); const l = visible(); if (!l.find((x) => x.id === S.sel)) selectFirstIfNone(); render(); }
async function act(action, extra) {
  const before = visible(), idx = before.findIndex((x) => x.id === S.sel);
  const res = await api("/api/action", Object.assign({ project: S.cur, action }, extra));
  if (!res.ok) { S.note = { bad: true, text: res.message }; renderDetail(); return; }
  toast(res.message);
  S.panel = S.diff = S.note = S.editing = null;
  await loadProject(S.cur, true);
  const after = visible();
  if (!after.find((x) => x.id === S.sel)) { S.sel = after.length ? after[Math.min(idx, after.length - 1)].id : null; }
  render();
}
function move(delta) {
  const list = visible(); if (!list.length) return;
  const i = Math.max(0, Math.min(list.length - 1, list.findIndex((x) => x.id === S.sel) + delta));
  S.sel = list[i].id; S.editing = S.panel = S.diff = S.note = null; render();
}
function approve(item) {
  if (item.kind === "trust") act("set_trust", { page: item.page, trust: "agreed" });
  else if (item.kind === "drift") act("confirm", { page: item.page });
}
function remove(item) {
  if (item.kind === "trust") { if (confirm(t("sure"))) act("set_status", { page: item.page, status: "deprecated" }); }
  else if (item.kind === "inbox") { if (confirm(t("sure"))) act("inbox_discard", { file: item.file, heading: item.heading }); }
}
async function showDiff(item) {
  const res = await api("/api/diff?project=" + S.cur + "&page=" + encodeURIComponent(item.page));
  S.diff = res.ok ? res.diff : res.message; renderDetail();
}
function doAction(name) {
  const item = current(); if (!item) return;
  if (name === "approve" || name === "confirm") approve(item);
  else if (name === "edit") { S.editing = true; renderDetail(); }
  else if (name === "deprecate" || name === "discard") remove(item);
  else if (name === "diff") showDiff(item);
  else if (name === "newpage" || name === "append") { S.panel = S.panel === name ? null : name; renderDetail(); }
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const tgt = e.target.closest("[data-tab],[data-kind],[data-id],[data-act]"); if (!tgt) return;
  if (tgt.dataset.tab !== undefined) { S.cur = +tgt.dataset.tab; S.sel = null; S.kind = null; selectFirstIfNone(); render(); if (!S.data[S.cur]) loadProject(S.cur); }
  else if (tgt.dataset.kind !== undefined) { S.kind = tgt.dataset.kind || null; S.sel = null; selectFirstIfNone(); render(); }
  else if (tgt.dataset.id !== undefined) { S.sel = tgt.dataset.id; S.editing = S.panel = S.diff = S.note = null; render(); }
  else if (tgt.dataset.act) doAction(tgt.dataset.act);
});
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if ($("help").open || $("src").open) return;
  const k = e.key, item = current();
  if (k === "j" || k === "ArrowDown") { e.preventDefault(); move(1); }
  else if (k === "k" || k === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (k === "a" && item) approve(item);
  else if (k === "e" && item && item.kind !== "inbox") { e.preventDefault(); doAction("edit"); }
  else if (k === "d" && item) remove(item);
  else if (k === "?") showHelp();
});
function showHelp() {
  $("helpRows").innerHTML = "<caption><b>" + t("sKeys") + "</b></caption>" + [
    ["j / k, ↓ / ↑", t("kMove")], ["a", t("kApprove")], ["e", t("kEdit")], ["d", t("kDel")], ["?", t("kHelp")]
  ].map(([k, v]) => "<tr><td><kbd>" + esc(k) + "</kbd></td><td>" + esc(v) + "</td></tr>").join("");
  document.querySelector("#help button").textContent = t("close");
  $("help").showModal();
}
$("helpBtn").onclick = showHelp;
$("langBtn").onclick = () => { lang = lang === "vi" ? "en" : "vi"; localStorage.setItem("pbrain.lang", lang); render(); };
$("commitBtn").onclick = () => {
  const box = $("commitbox"), d = proj();
  if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
  $("commitFiles").textContent = (d.git_changes.length ? d.git_changes.join("\n") : t("noFiles")) + "\n" + t("commitHint");
  $("commitFiles").style.whiteSpace = "pre-wrap";
  if (!$("commitMsg").value) $("commitMsg").value = t("commitMsg");
  $("commitGo").textContent = t("commit"); $("commitClose").textContent = t("close");
  $("commitOut").classList.add("hidden"); box.classList.remove("hidden");
};
$("commitClose").onclick = () => $("commitbox").classList.add("hidden");
$("commitGo").onclick = async () => {
  const res = await api("/api/action", { project: S.cur, action: "commit", message: $("commitMsg").value });
  const out = $("commitOut"); out.textContent = (res.ok ? "" : "exit " + res.exit + "\n") + (res.output || res.message); out.classList.remove("hidden");
  await loadProject(S.cur, true);
  if (res.ok) toast(t("commit") + ": OK");
};
init();
</script>
</body>
