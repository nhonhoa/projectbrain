[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-ui"
version = "0.1.0"
description = "Reusable Django app: shared admin UI layer (JS modules, CSS, template components, number formatting)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["Django>=4.2"]

[tool.setuptools.packages.find]
include = ["hub_ui*"]

[tool.setuptools.package-data]
hub_ui = ["static/hub_ui/*", "templates/hub_ui/*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
